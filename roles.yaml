# Who holds which role (SOP-001 section 3). Procedures name roles, never people.
# One person can hold several roles. When the team changes, update this file through a PR.

people:
  - id: kc
    name: Kelvin Chow
    github: kelvinchow23    # proposed by the agent from the minimal-qms repo owner; kc to confirm

roles:
  quality_lead: [kc]
  approver:
    design: [kc]
    documents: [kc]
    release: [kc]
    nonconformance: [kc]
  internal_auditor: []     # must not audit their own work; name an outside person. Open: kc chose to leave it unnamed at G0 and name one before QMS-rev A (2026-11-23).
  builder: [kc]            # assembles and tests the units (G0 answer, 2026-11-23). Not a role in the SOP-001-A04 template; see finding Q3 in 02_design/reviews/DR-001/package.md.

# Agents are authors and reviewers, never approvers.
agents:
  - id: design-agent
    tool: "Claude Code (Claude Opus 5.5)"
  - id: review-agent
    tool: "Claude Code, fresh subagent session with no memory of the work (Claude Opus 5.5). kc accepted same-model review for the pilot (2026-11-23)."
