# Development plan (SOP-004 section 4). Change through a PR; old values stay in git history.
# G0 scope as restated by kc on 2026-11-23 (earlier, more detailed drafts are in git history;
# that detail is kept in worklog.md as input for G1). "open" marks what is not yet answered.
product: null              # top assembly part number, allocated in the design stage
iteration: 1
qms_rev: "f4d60f4"   # the minimalQMS revision this project runs under
goal: >-
  A minimal hardware unit that can be deployed in self-driving labs, used as a hardware
  pilot to run design iterations through minimalQMS. Each iteration should produce a
  working unit and a list of QMS fixes. When the two conflict, the product comes first.
scope:
  in:
    - "Design, build and test a minimal sensing hardware unit deployable in a self-driving lab"
    - "Iterate the unit through minimalQMS (G0 to G4, then further iterations)"
  out: []
  open:
    - "What is explicitly out of scope: kc to decide at the G0 review"
make_buy:
  - {item: electronics, decision: buy, note: "off-the-shelf boards; parts chosen in the design stage"}
  - {item: integration, decision: make, note: "in-house"}
  - {item: software, decision: make, note: "in-house"}
  - {item: enclosure, decision: make, note: "in-house, if one is needed"}
roles: roles.yaml
gates:
  - {gate: G0, target: 2026-11-23, actual: null, approval: null}
  - {gate: G1, target: 2026-11-27, actual: null, approval: null}   # kc plans G1 back to back with G0
  - {gate: G2, target: 2026-12-04, actual: null, approval: null}
  - {gate: G3, target: 2026-12-11, actual: null, approval: null}
  - {gate: G4, target: 2026-12-18, actual: null, approval: null}
skipped_gates: []
