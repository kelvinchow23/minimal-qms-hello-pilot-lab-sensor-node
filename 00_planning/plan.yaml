# Development plan (SOP-004 section 4). Change through a PR; old values stay in git history.
# G0 scope as restated by kc on 2026-11-23 (earlier, more detailed drafts are in git history;
# that detail is kept in worklog.md as input for G1). "open" marks what is not yet answered.
involvement: balanced      # kc, 2026-11-26: "im ok going with balanced right now". G0 and G1 were passed one at a time; next G2, then G3 + G4 together (minimal-qms PR #43)
product: LSN-A-0001        # top assembly, allocated 2026-11-24 in the design stage
iteration: 1
qms_rev: "f0ba1f4"   # the minimalQMS revision this project runs under (copier update 2026-11-26, from f4d60f4)
goal: >-
  A minimal hardware unit that can be deployed in self-driving labs, used as a hardware
  pilot to run design iterations through minimalQMS. Each iteration should produce a
  working unit and a list of QMS fixes. When the two conflict, the product comes first.
scope:
  in:
    - "Design, build and test a minimal sensing hardware unit deployable in a self-driving lab"
    - "Iterate the unit through minimalQMS (G0 to G4, then further iterations)"
    - "Build and test 2 units in iteration 1"   # added 2026-11-24 at G1 (kc chose "Every 10 s, 2 units")
  out:
    - "Recovering readings lost while the network or server is down"   # added 2026-11-24 at G1 (kc: "that should be out of scope")
make_buy:
  - {item: electronics, decision: buy, note: "off-the-shelf boards; parts chosen in the design stage"}
  - {item: assembly, decision: make, note: "in-house: wiring the bought boards together and fitting them in the enclosure"}
  - {item: software, decision: make, note: "in-house"}
  - {item: enclosure, decision: make, note: "in-house, if one is needed"}
roles: roles.yaml
gates:
  - {gate: G0, target: 2026-11-23, actual: 2026-11-23, approval: "02_design/reviews/DR-001/minutes.md (kc, 2026-11-23 01:40 EST)"}
  - {gate: G1, target: 2026-11-24, actual: 2026-11-24, approval: "02_design/reviews/DR-002/minutes.md (kc, 2026-11-24 10:01 EST)"}
  - {gate: G2, target: 2026-11-26, actual: null, approval: null}
  - {gate: G3, target: 2026-11-28, actual: null, approval: null}
  - {gate: G4, target: 2026-11-30, actual: null, approval: null}
